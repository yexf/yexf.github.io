# NexT 主题自定义配置
# 此文件会与 node_modules/hexo-theme-next/_config.yml 默认配置合并（本站优先）
# 文档: https://theme-next.org/docs/theme-settings/

# 顶部导航菜单：显示归档入口
menu:
  archives: /archives/ || fa fa-archive

# 侧边栏社交链接（显示在作者信息下方）
social:
  GitHub: https://github.com/yexf || fab fa-github
  博客: https://blog.yexf.eu.cc/ || fa fa-globe

# 侧边栏头像（猫头鹰 Logo）
avatar:
  url: /images/avatar.png
  rounded: true

sidebar:
  # 侧边栏默认显示: post=仅文章页 / always=所有页面
  display: always
